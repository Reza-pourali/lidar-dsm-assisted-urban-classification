[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-dsm-classification"
version = "0.1.0"
description = "LiDAR DSM generation and DSM-assisted urban land-cover classification."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "whitebox>=2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
